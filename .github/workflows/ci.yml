name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          persist-credentials: false
      - name: No game data in the tree
        run: python3 tools/check_no_game_data.py
      - name: Tool tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Dependencies
        run: brew install ninja
      - name: Configure without a disc
        run: cmake -S . -B build-nodisc -G Ninja
      - name: Compile the runtime
        run: ninja -C build-nodisc runtime_check
