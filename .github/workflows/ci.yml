name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tools:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        python: [python3, /usr/bin/python3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: No game data in the tree
        run: ${{ matrix.python }} tools/check_no_game_data.py
      - name: Tool tests
        run: ${{ matrix.python }} -m unittest discover -s tools -p 'test_*.py'
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Dependencies
        run: brew install ninja
      - name: Configure without a disc
        run: cmake -S . -B build-nodisc -G Ninja
      - name: Compile the runtime
        run: ninja -C build-nodisc runtime_check
      - name: Engine unit tests
        run: ninja -C build-nodisc unit
  kit:
    runs-on: macos-26
    env:
      # A player's kit may sit under a path with spaces, so this one does too.
      KIT: ${{ github.workspace }}/engine kit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Dependencies
        run: brew install ninja
      - name: Configure without a disc
        run: >-
          cmake -S . -B build-kit -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DGAME_ISO=
      - name: Compile the engine and SDL
        run: ninja -C build-kit runtime_check SDL3-static
      - name: Make the kit
        run: python3 tools/engine_kit.py --build build-kit --out "$KIT" --strip-debug
      # The stub tables stand in for the recompiler's output, so a framework missing from
      # game_libs.txt fails this link.
      - name: Link the kit against stub tables
        run: |
          mkdir -p "stub game/gen"
          cp tests/kit/stub_tables.c "stub game/gen/"
          cd "stub game"
          make -f "$KIT/Makefile" KIT="$KIT" SDK="$(xcrun --show-sdk-path)" CC=clang CXX=clang++
          test -x dragoon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-kit
          path: ${{ env.KIT }}
          if-no-files-found: error
  launcher:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Launcher tool tests
        run: python3 -m unittest discover -s launcher/tools -p 'test_*.py'
      - name: Launcher tool tests, system Python
        run: /usr/bin/python3 -m unittest discover -s launcher/tools -p 'test_*.py'
      - name: Swift tests
        if: ${{ hashFiles('launcher/Package.swift') != '' }}
        run: swift test --package-path launcher
