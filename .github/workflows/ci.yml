name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # tools/ci.py holds every job's steps, so a Mac runs the same ones with `tools/ci.py`.
  tools:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Tools job
        run: python3 tools/ci.py tools
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Dependencies
        run: brew install ninja
      - name: Engine and src/ job
        run: python3 tools/ci.py macos
  kit:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Dependencies
        run: brew install ninja
      - name: Kit job
        run: python3 tools/ci.py kit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-kit
          path: ${{ github.workspace }}/engine kit
          if-no-files-found: error
  launcher:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Launcher job
        run: python3 tools/ci.py launcher
