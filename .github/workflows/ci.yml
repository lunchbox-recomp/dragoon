name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: No game data in the tree
        run: python3 tools/check_no_game_data.py
      - name: Tool tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Dependencies
        run: brew install ninja
      - name: Configure without a disc
        run: cmake -S . -B build-nodisc -G Ninja
      - name: Compile the runtime
        run: ninja -C build-nodisc runtime_check
